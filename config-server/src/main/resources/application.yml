spring:
  application:
    name: config-server
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Ram-2023/config-server-repo
          clone-on-start: true
          default-label: main
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 172.23.16.1
    instance-id: ${spring.application.name}:${server.port}
server:
  port: 8888

